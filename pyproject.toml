[project]
name = "lms"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Asheesh Ranjan Srivastava", email = "asheeshsrivastava9@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "google-genai>=2.34.0",
    "httpx>=0.28.1",
    "openai>=3.45.0",
    "pydantic>=2.14.2",
    "pytest>=9.2.0",
    "pyyaml>=6.0.3",
    "uvicorn>=0.30.0",
    "websockets>=17.4",
]

[project.scripts]
lms = "lms:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# Start with real-error rules only; widen later, one rule group per PR.
select = ["E4", "E7", "E9", "F"]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff==0.16.0",
]
variants = [
    "llama-index-core==0.14.25",
]
