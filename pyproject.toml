[project]
name = "lms"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Asheesh Ranjan Srivastava", email = "asheeshsrivastava9@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.2",
    "pytest>=9.2.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
lms = "lms:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
variants = [
    "llama-index-core==0.14.25",
]
