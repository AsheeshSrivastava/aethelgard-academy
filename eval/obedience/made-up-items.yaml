# Made-up items for the SPEC-30 obedience eval (R11).
# Every question asks about a function, class, option or flag that does NOT exist in the named library.
# The point: with no course source, a model must not describe an invented name as if it were real.
# Questions only: no answers, no keys, no model output. Drafted for the owner to review (which names are invented).
# `set` is spelled like the file stems of eval/gemini-sets/. `invented` is the identifier the checker looks for.

- id: made-pytest-01
  set: pytest-docs
  q: How do I use pytest.fixture_snapshot_restore to roll my fixtures back after each test?
  invented: pytest.fixture_snapshot_restore
- id: made-pytest-02
