out_of_scope:
- q: how do i automatically retry failed 503 requests with exponential backoff using tenacity?
  kind: neighbouring
  why: httpx-docs does not document tenacity or built-in exponential backoff retry policies
- q: how do i cache http responses on disk with hishel?
  kind: neighbouring
  why: httpx-docs mentions third-party packages briefly but does not document how to configure hishel caching
- q: how do i use httpx to connect to a websocket server?
  kind: neighbouring
  why: httpx is an HTTP client and httpx-docs does not cover WebSocket clients
- q: how do i use aiohttp ClientSession instead of httpx?
  kind: neighbouring
  why: httpx-docs documents HTTPX only, not aiohttp
- q: how do i make a fetch() request with AbortController timeout in javascript?
  kind: other-tool
  why: httpx-docs is for Python HTTPX, not browser or Node.js fetch
- q: how do i configure axios interceptors in typescript?
  kind: other-tool
  why: httpx-docs is for Python HTTPX, not JavaScript Axios
- q: how do i use curl with -L and -H flags from bash?
  kind: other-tool
  why: httpx-docs is for Python HTTPX, not the curl CLI
- q: what is the difference between http 401 unauthorized and 403 forbidden?
  kind: general
  why: httpx-docs does not teach general HTTP status code semantics
- q: how do i design idempotency keys for payment apis?
  kind: general
  why: httpx-docs does not cover general backend API design patterns
