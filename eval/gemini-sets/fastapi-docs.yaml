out_of_scope:
- q: how do i write alembic database migrations for my sqlmodel tables?
  kind: neighbouring
  why: fastapi-docs covers SQLModel basics but does not document Alembic migrations
- q: how do i set up celery with redis for distributed background job queues?
  kind: neighbouring
  why: fastapi-docs covers FastAPI BackgroundTasks, not Celery or Redis job queues
- q: how do i rate limit fastapi endpoints per ip address with slowapi?
  kind: neighbouring
  why: fastapi-docs does not document slowapi or rate limiting
- q: how do i configure gunicorn worker timeouts in a systemd unit file?
  kind: neighbouring
  why: fastapi-docs covers server workers conceptually but does not document systemd unit files or gunicorn timeout tuning
- q: how do i define an express.js router middleware in typescript?
  kind: other-tool
  why: fastapi-docs is for Python FastAPI, not Node.js Express
- q: how do i create a spring boot @RestController with @GetMapping?
  kind: other-tool
  why: fastapi-docs is for Python FastAPI, not Java Spring Boot
- q: how do i validate json request bodies in go gin using binding tags?
  kind: other-tool
  why: fastapi-docs is for Python FastAPI, not Go Gin
