out_of_scope:
- q: how do i get a line-by-line code coverage percentage report when i run pytest?
  kind: neighbouring
  why: pytest-docs does not document pytest-cov or coverage.py configuration and reports
- q: how do i run my pytest suite in parallel across multiple cpu cores?
  kind: neighbouring
  why: pytest-docs mentions pytest-xdist only as a third-party plugin and does not explain parallel execution
- q: how do i test async def functions with pytest?
  kind: neighbouring
  why: pytest-docs does not cover pytest-asyncio or async test execution
- q: how do i use unittest.mock.patch with pytest?
  kind: neighbouring
  why: pytest-docs covers monkeypatch rather than unittest.mock or pytest-mock
- q: how do i mock a module with jest.mock in my react tests?
  kind: other-tool
  why: pytest-docs is for Python pytest, not JavaScript Jest
- q: how do i run only one test method in junit 5 with maven?
  kind: other-tool
  why: pytest-docs is for Python pytest, not Java JUnit or Maven
- q: how do i write table-driven tests in go using t.Run?
  kind: other-tool
  why: pytest-docs is for Python pytest, not Go testing
- q: should i put unit tests or integration tests first on my backend engineering resume?
  kind: general
  why: pytest-docs does not give career or resume advice
- q: what is the difference between a unit test, an integration test, and an end-to-end test?
  kind: general
  why: pytest-docs does not teach general software testing taxonomy
- q: |
    why is this failing??
    C:\Users\sam\shop\shop\pricing.py:4: in apply_discount
        return apply_discount(price - 1)
    E   RecursionError: maximum recursion depth exceeded
    def apply_discount(price):
        return apply_discount(price - 1)
  kind: general
  why: the failure is an infinite recursion bug in the user's Python code, not a pytest behavior explained in the docs
