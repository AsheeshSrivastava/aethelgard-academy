- q: how do i use pydantic-ai to build structured llm agents?
  kind: neighbouring
  why: pydantic-docs does not cover the separate pydantic-ai library
- q: how do i migrate from marshmallow schemas to pydantic v2?
  kind: neighbouring
  why: pydantic-docs does not include a Marshmallow migration guide
