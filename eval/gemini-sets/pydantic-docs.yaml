- q: |
    why is this failing??
    pydantic.errors.PydanticUserError: `Order` is not fully defined; you should define `Customer`, then call `Order.model_rebuild()`.
    C:\Users\sam\shop\schemas\order.py:6
    class Order(BaseModel):
        customer: "Customer"
    class Customer(BaseModel):
        orders: list[Order] = []
  kind: pasted
  expect: [forward_annotations]
- q: |
    why didn't pydantic catch this invalid default value??
    no error raised when defining User, User() returns age='not-a-number'
    C:\Users\sam\shop\schemas\user.py:4
    class User(BaseModel):
        age: int = "not-a-number"
    u = User()
  kind: pasted
  expect: [fields]
- q: |
    why did this fail when passing my orm object??
    pydantic_core._pydantic_core.ValidationError: 1 validation error for UserOut
      Input should be a valid dictionary or instance of UserOut [type=model_type, input_value=<UserORM id=1>]
    C:\Users\sam\shop\routes\users.py:11
    orm_user = db.get(UserORM, 1)
    return UserOut.model_validate(orm_user)
  kind: pasted
  expect: [models]
- q: |
    why does assigning a bad value after creation not raise an error??
    expected ValidationError, got no error and u.age == "oops"
    C:\Users\sam\shop\schemas\user.py:9
    class User(BaseModel):
        age: int
    u = User(age=20)
    u.age = "oops"
  kind: pasted
  expect: [config]
- q: |
    why is it rejecting my camelCase json when i set an alias??
    ValidationError: 1 validation error for Item
    firstName
      Field required [type=missing, input_value={'first_name': 'Sam'}, input_type=dict]
    C:\Users\sam\shop\schemas\item.py:5
    class Item(BaseModel):
        first_name: str = Field(alias="firstName")
    Item(first_name="Sam")
  kind: pasted
  expect: [alias]
- q: |
    why did this fail when my validator returned nothing??
    ValidationError: 1 validation error for Product
    name
      Input should be a valid string [type=string_type, input_value=None]
    C:\Users\sam\shop\schemas\product.py:8
    @field_validator("name")
    @classmethod
    def check_name(cls, v: str) -> str:
        if not v.strip():
            raise ValueError("empty")
  kind: pasted
  expect: [validators]
- q: |
    why is pydantic rejecting extra keys i didn't list??
