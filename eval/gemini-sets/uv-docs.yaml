- q: |
    why is this failing??
    × Failed to build `numpy==1.19.5`
    ├─▶ The build backend returned an error
    ╰─▶ Call to `setuptools.build_meta:__legacy__.build_wheel` failed (exit status: 1)
    C:\Users\sam\shop\pyproject.toml:6
    [project]
    requires-python = ">=3.12"
    dependencies = ["numpy==1.19.5"]
  kind: pasted
  expect: [reference/troubleshooting/build-failures]
- q: |
    why can't uv install these two packages together??
    x No solution found when resolving dependencies:
    ╰─▶ Because pkg-a==1.0.0 depends on httpx>=0.27 and pkg-b==2.0.0 depends on httpx<0.25, we can conclude that pkg-a==1.0.0 and pkg-b==2.0.0 are incompatible.
    C:\Users\sam\shop\pyproject.toml:5
    dependencies = ["pkg-a==1.0.0", "pkg-b==2.0.0"]
  kind: pasted
  expect: [concepts/resolution]
- q: |
    why is my standalone script failing when httpx is in my project??
    Traceback (most recent call last):
      File "C:\Users\sam\shop\scripts\fetch.py", line 1, in <module>
        import httpx
    ModuleNotFoundError: No module named 'httpx'
    # ran: uv run --no-project scripts/fetch.py
    import httpx
    print(httpx.get("https://example.com").status_code)
  kind: pasted
  expect: [guides/scripts]
