out_of_scope:
- q: how do i configure poetry groups and poetry.lock in an existing poetry project?
  kind: neighbouring
  why: uv-docs documents uv and pip compatibility, not Poetry commands or poetry.lock management
- q: how do i create a conda environment.yml file with mambaforge channels?
  kind: neighbouring
  why: uv-docs does not document Conda or Mamba environment.yml workflows
- q: how do i write a custom setuptools setup.py C extension with cython?
  kind: neighbouring
  why: uv-docs does not teach how to write Cython or setuptools C extensions
- q: how do i publish a package to npm with package.json?
  kind: other-tool
  why: uv-docs is for Python uv, not Node.js npm
- q: how do i use cargo add and Cargo.lock in a rust project?
  kind: other-tool
  why: uv-docs is for Python uv, not Rust Cargo
- q: how do i manage go modules with go mod tidy?
  kind: other-tool
  why: uv-docs is for Python uv, not Go modules
- q: how do i deploy and configure a self-hosted devpi or pypiserver instance?
  kind: neighbouring
  why: uv-docs covers publishing and authenticating to indexes, not setting up or hosting devpi or pypiserver
- q: should i use a monorepo or separate repositories for my backend microservices?
  kind: general
  why: uv-docs covers uv workspaces technically but does not give general monorepo vs polyrepo architecture advice
- q: how do i explain dependency management and reproducibility in a junior dev interview?
  kind: general
  why: uv-docs does not give career or interview advice
- q: |
    why is this failing??
    C:\Users\sam\shop\main.py:5: in start
        app.run(port="8000")
    TypeError: port must be an int, not str
    def start():
        app.run(port="8000")
  kind: general
  why: the error is an application argument type bug in user code, not a uv packaging or environment issue
